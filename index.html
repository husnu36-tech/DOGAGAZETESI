<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Doğa Gazetesi - Özgür Yurttaş Medyası</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; border-radius: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .haber-kart { background: white; padding: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .sansur-notu { border-left: 3px solid red; padding-left: 10px; color: #555; font-size: 0.9em; margin-top: 15px; }
        footer { margin-top: 40px; text-align: center; color: #7f8c8d; font-size: 0.8em; }
    </style>
</head>
<body>

    <header>
        <h1>🌱 DOĞA GAZETESİ</h1>
        <p>Her İnsan Bir Doğal Gazetecidir - Almanya Merkezli Bağımsız Yayın</p>
    </header>

    <!-- Haberlerin Listeleneceği Özgür Akış Alanı -->
    <div class="grid" id="haberler-alani">
        <!-- Haberler buraya otomatik yüklenecek -->
    </div>

    <footer>
        <p>Bu sitedeki tüm içerik ve yorumlardan yazarları sorumludur. Sitemiz TMG §5 uyarınca Yer Sağlayıcıdır.</p>
    </footer>

</body>
</html>
